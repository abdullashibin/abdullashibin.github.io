<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=240, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gemini Live</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #ffffff;
      font-family: sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }
    header {
      width: 100%;
      background: #111827;
      color: #60a5fa;
      font-size: 12px;
      font-weight: bold;
      padding: 5px;
      border-bottom: 1px solid #1f2937;
    }
    #setup-screen, #call-screen {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 8px;
    }
    .hidden { display: none !important; }
    input {
      width: 100%;
      background: #030712;
      color: #ffffff;
      border: 2px solid #3b82f6;
      border-radius: 4px;
      padding: 6px;
      font-size: 13px;
      margin: 8px 0;
      outline: none;
    }
    #orb {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: #1e293b;
      border: 4px solid #3b82f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
      transition: all 0.2s;
    }
    #orb.listening {
      background: #064e3b;
      border-color: #10b981;
      box-shadow: 0 0 16px #10b981;
    }
    #orb.speaking {
      background: #1e3a8a;
      border-color: #60a5fa;
      box-shadow: 0 0 18px #3b82f6;
    }
    #orb.thinking {
      background: #581c87;
      border-color: #a855f7;
      box-shadow: 0 0 16px #a855f7;
    }
    #orb.muted {
      background: #7f1d1d;
      border-color: #ef4444;
    }
    #status {
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.3;
      padding: 0 4px;
      word-break: break-word;
      max-height: 52px;
      overflow: hidden;
    }
    footer {
      width: 100%;
      background: #030712;
      color: #9ca3af;
      font-size: 11px;
      font-weight: bold;
      padding: 5px 8px;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #1f2937;
    }
    .hi { color: #ffffff; }
  </style>
</head>
<body>

  <header>GEMINI LIVE TALK</header>

  <!-- SCREEN 1: ONE-TIME KEY SETUP -->
  <div id="setup-screen">
    <div style="font-size: 12px; color: #cbd5e1;">Enter Gemini API Key:</div>
    <input id="key-input" type="password" placeholder="AIzaSy..." autocomplete="off">
    <div style="font-size: 10px; color: #9ca3af; margin-top: 4px;">
      Tip: Load once with #key=AIza... in URL to auto-save.
    </div>
  </div>

  <!-- SCREEN 2: LIVE VOICE CALL -->
  <div id="call-screen" class="hidden">
    <div id="orb">OFFLINE</div>
    <div id="status">Press OK to call</div>
  </div>

  <!-- Native HTML5 audio bridge for Cloud Phone streaming -->
  <audio id="cloud-player" autoplay playsinline style="display:none;"></audio>

  <footer>
    <span id="left-hint">Clear</span>
    <span id="center-hint" class="hi">OK: SAVE</span>
    <span id="right-hint">Exit</span>
  </footer>

  <script>
    const MODEL = "models/gemini-3.8-live";
    const STORAGE_KEY = "hmd_gemini_live_key";

    const setupScreen = document.getElementById("setup-screen");
    const callScreen = document.getElementById("call-screen");
    const keyInput = document.getElementById("key-input");
    const orb = document.getElementById("orb");
    const statusEl = document.getElementById("status");
    const leftHint = document.getElementById("left-hint");
    const centerHint = document.getElementById("center-hint");
    const rightHint = document.getElementById("right-hint");
    const cloudPlayer = document.getElementById("cloud-player");

    // Auto-save key from URL Hash (#key=...) or Query Param (?key=...)
    const hashMatch = window.location.hash.match(/key=([^&]+)/);
    const searchMatch = window.location.search.match(/[?&]key=([^&]+)/);
    const foundKey = (hashMatch && hashMatch[1]) || (searchMatch && searchMatch[1]);
    if (foundKey) {
      localStorage.setItem(STORAGE_KEY, decodeURIComponent(foundKey));
      history.replaceState(null, "", window.location.pathname);
    }

    let apiKey = localStorage.getItem(STORAGE_KEY) || "";
    let ws = null;
    let audioCtx = null;
    let micStream = null;
    let micSourceNode = null;
    let processor = null;
    let mediaStreamDest = null;
    let isConnected = false;
    let setupDone = false;
    let isMuted = false;
    let nextPlayTime = 0;
    let activeSources = [];

    // Hybrid VAD
    let isSpeaking = false;
    let silenceTimer = null;

    function updateScreen() {
      if (!apiKey) {
        setupScreen.classList.remove("hidden");
        callScreen.classList.add("hidden");
        leftHint.textContent = "Clear";
        centerHint.textContent = "OK: SAVE";
        rightHint.textContent = "Back";
        keyInput.focus();
      } else {
        setupScreen.classList.add("hidden");
        callScreen.classList.remove("hidden");
        leftHint.textContent = isConnected ? "Mute" : "0: Reset";
        centerHint.textContent = isConnected ? "OK: END" : "OK: CALL";
        rightHint.textContent = isConnected ? "End" : "Exit";
      }
    }

    // Linear Resampling Float32 helper
    function resampleFloat32(source, fromRate, toRate) {
      if (fromRate === toRate) return source;
      const ratio = fromRate / toRate;
      const newLen = Math.round(source.length / ratio);
      const target = new Float32Array(newLen);
      for (let i = 0; i < newLen; i++) {
        const originIdx = i * ratio;
        const idx = Math.floor(originIdx);
        const frac = originIdx - idx;
        const next = idx + 1 < source.length ? source[idx + 1] : source[idx];
        target[i] = source[idx] + frac * (next - source[idx]);
      }
      return target;
    }

    // Convert Float32 mic data to 16kHz PCM Base64
    function downsampleAndConvert16BitPCM(inputData, inputSampleRate) {
      const samples = resampleFloat32(inputData, inputSampleRate, 16000);
      const buffer = new ArrayBuffer(samples.length * 2);
      const view = new DataView(buffer);
      for (let i = 0; i < samples.length; i++) {
        let s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }

      let binary = "";
      const bytes = new Uint8Array(buffer);
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    function stopAllPlayingAudio() {
      activeSources.forEach(src => {
        try { src.stop(); } catch (_) {}
      });
      activeSources = [];
      if (audioCtx) nextPlayTime = audioCtx.currentTime;
    }

    function playPcmChunk(base64Data) {
      if (!audioCtx) return;
      try {
        if (audioCtx.state === "suspended") audioCtx.resume();

        const binary = atob(base64Data);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
          bytes[i] = binary.charCodeAt(i);
        }

        const dataView = new DataView(bytes.buffer);
        const sampleCount = Math.floor(bytes.byteLength / 2);
        const float32_24k = new Float32Array(sampleCount);
        for (let i = 0; i < sampleCount; i++) {
          float32_24k[i] = dataView.getInt16(i * 2, true) / 32768.0;
        }

        // Resample incoming 24kHz PCM to audioCtx native rate (44.1k/48k)
        // This prevents NotSupportedError on mobile webviews that enforce native sampleRate!
        const nativeFloat32 = resampleFloat32(float32_24k, 24000, audioCtx.sampleRate);

        const audioBuffer = audioCtx.createBuffer(1, nativeFloat32.length, audioCtx.sampleRate);
        audioBuffer.getChannelData(0).set(nativeFloat32);

        const source = audioCtx.createBufferSource();
        source.buffer = audioBuffer;

        // Boost gain for phone loudspeaker
        const gainNode = audioCtx.createGain();
        gainNode.gain.value = 1.8;

        source.connect(gainNode);

        // Route to standard AudioContext destination
        gainNode.connect(audioCtx.destination);

        // ALSO route to HTML5 audio element stream bridge for Cloud Phone!
        if (mediaStreamDest) {
          gainNode.connect(mediaStreamDest);
        }

        const now = audioCtx.currentTime;
        if (nextPlayTime < now) nextPlayTime = now;
        source.start(nextPlayTime);
        nextPlayTime += audioBuffer.duration;

        activeSources.push(source);
        orb.className = "speaking";
        orb.textContent = "SPEAKING";

        source.onended = () => {
          const idx = activeSources.indexOf(source);
          if (idx !== -1) activeSources.splice(idx, 1);

          if (activeSources.length === 0 && isConnected) {
            orb.className = isMuted ? "muted" : "listening";
            orb.textContent = isMuted ? "MUTED" : "LISTENING";
          }
        };
      } catch (err) {
        console.error("Playback error:", err);
        statusEl.textContent = "Audio error: " + err.message;
      }
    }

    async function startLiveCall() {
      const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${apiKey}`;

      try {
        statusEl.textContent = "Opening mic...";
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
        });

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") await audioCtx.resume();
        nextPlayTime = audioCtx.currentTime;

        // Warm up audio channel with user gesture so Cloud Phone audio pipeline activates
        try {
          const osc = audioCtx.createOscillator();
          const warmGain = audioCtx.createGain();
          warmGain.gain.value = 0.001;
          osc.connect(warmGain);
          warmGain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.03);
        } catch (_) {}

        // Set up HTML5 MediaStream bridge for Cloud Phone streaming (same pipeline YouTube uses!)
        try {
          if (audioCtx.createMediaStreamDestination) {
            mediaStreamDest = audioCtx.createMediaStreamDestination();
            cloudPlayer.srcObject = mediaStreamDest.stream;
            cloudPlayer.play().catch(() => {});
          }
        } catch (e) {
          console.log("MediaStreamDest unsupported:", e);
        }

        statusEl.textContent = "Connecting...";
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          statusEl.textContent = "Handshaking...";
          ws.send(JSON.stringify({
            setup: {
              model: MODEL,
              generationConfig: {
                responseModalities: ["AUDIO"],
                speechConfig: {
                  voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } }
                }
              },
              inputAudioTranscription: {},
              outputAudioTranscription: {},
              systemInstruction: {
                parts: [{ text: "You are talking on a real-time live phone call with a user on a feature phone. Be direct, natural, warm, and keep replies short (1-2 sentences)." }]
              }
            }
          }));

          isConnected = true;
          setupDone = false;
          updateScreen();
          orb.className = "listening";
          orb.textContent = "CONNECTING";

          micSourceNode = audioCtx.createMediaStreamSource(micStream);
          processor = audioCtx.createScriptProcessor(4096, 1, 1);

          processor.onaudioprocess = (e) => {
            if (!isConnected || !setupDone || isMuted || ws.readyState !== WebSocket.OPEN) return;
            const inputData = e.inputBuffer.getChannelData(0);

            // Speech & Silence Detection
            let sum = 0;
            for (let i = 0; i < inputData.length; i += 4) {
              sum += inputData[i] * inputData[i];
            }
            const rms = Math.sqrt(sum / (inputData.length / 4));

            if (rms > 0.025) {
              isSpeaking = true;
              if (silenceTimer) {
                clearTimeout(silenceTimer);
                silenceTimer = null;
              }
              if (activeSources.length === 0) {
                statusEl.textContent = "Hearing you...";
              }
            } else if (isSpeaking) {
              if (!silenceTimer) {
                // When silence lasts 750ms after speech, tell Gemini to answer immediately!
                silenceTimer = setTimeout(() => {
                  if (ws && ws.readyState === WebSocket.OPEN && activeSources.length === 0) {
                    orb.className = "thinking";
                    orb.textContent = "THINKING";
                    statusEl.textContent = "Thinking...";
                    ws.send(JSON.stringify({
                      realtimeInput: { audioStreamEnd: true }
                    }));
                  }
                  isSpeaking = false;
                  silenceTimer = null;
                }, 750);
              }
            }

            const base64Pcm = downsampleAndConvert16BitPCM(inputData, audioCtx.sampleRate);

            ws.send(JSON.stringify({
              realtimeInput: {
                audio: { data: base64Pcm, mimeType: "audio/pcm;rate=16000" },
                mediaChunks: [{ data: base64Pcm, mimeType: "audio/pcm;rate=16000" }]
              }
            }));
          };

          micSourceNode.connect(processor);
          processor.connect(audioCtx.destination);
        };

        ws.onmessage = async (event) => {
          let text;
          if (event.data instanceof Blob) {
            text = await event.data.text();
          } else if (event.data instanceof ArrayBuffer) {
            text = new TextDecoder().decode(event.data);
          } else {
            text = event.data;
          }

          const msg = JSON.parse(text);

          if (msg.error) {
            statusEl.textContent = "Error: " + (msg.error.message || JSON.stringify(msg.error));
            console.error("Gemini Error:", msg.error);
            return;
          }

          if (msg.setupComplete) {
            setupDone = true;
            statusEl.textContent = "Live! Speak now.";
            orb.className = "listening";
            orb.textContent = "LISTENING";
            return;
          }

          if (msg.serverContent?.interrupted) {
            stopAllPlayingAudio();
            if (isConnected) {
              orb.className = isMuted ? "muted" : "listening";
              orb.textContent = isMuted ? "MUTED" : "LISTENING";
              statusEl.textContent = "Interrupted. Listening...";
            }
          }

          // User transcript
          if (msg.serverContent?.inputTranscription?.text) {
            statusEl.textContent = "You: " + msg.serverContent.inputTranscription.text;
          }

          // AI transcript
          if (msg.serverContent?.outputTranscription?.text) {
            statusEl.textContent = "AI: " + msg.serverContent.outputTranscription.text;
          }

          // Audio playback
          const parts = msg.serverContent?.modelTurn?.parts;
          if (parts) {
            for (const part of parts) {
              if (part.text && !msg.serverContent?.outputTranscription) {
                statusEl.textContent = "AI: " + part.text;
              }
              if (part.inlineData && part.inlineData.data) {
                playPcmChunk(part.inlineData.data);
              }
            }
          }

          if (msg.serverContent?.turnComplete) {
            if (activeSources.length === 0) {
              orb.className = isMuted ? "muted" : "listening";
              orb.textContent = isMuted ? "MUTED" : "LISTENING";
              statusEl.textContent = "Your turn to speak.";
            }
          }
        };

        ws.onerror = (e) => {
          statusEl.textContent = "Socket error. Check key/net.";
          console.error("WS error:", e);
          stopLiveCall();
        };

        ws.onclose = (e) => {
          console.log("WS closed:", e.code, e.reason);
          if (e.code !== 1000) {
            statusEl.textContent = `Ended: code ${e.code} ${e.reason || ''}`;
          }
          stopLiveCall();
        };

      } catch (err) {
        statusEl.textContent = "Audio error: " + err.message;
        console.error(err);
        stopLiveCall();
      }
    }

    function stopLiveCall() {
      isConnected = false;
      setupDone = false;
      isMuted = false;
      isSpeaking = false;
      if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
      stopAllPlayingAudio();
      if (processor) { processor.disconnect(); processor = null; }
      if (micSourceNode) { micSourceNode.disconnect(); micSourceNode = null; }
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      if (ws) { ws.close(); ws = null; }
      if (audioCtx) { audioCtx.close(); audioCtx = null; }
      mediaStreamDest = null;
      try { cloudPlayer.pause(); cloudPlayer.srcObject = null; } catch (_) {}
      orb.className = "";
      orb.textContent = "OFFLINE";
      if (!statusEl.textContent.startsWith("Ended") && !statusEl.textContent.startsWith("Error")) {
        statusEl.textContent = "Call ended. Press OK to call.";
      }
      updateScreen();
    }

    function toggleMute() {
      if (!isConnected) return;
      isMuted = !isMuted;
      orb.className = isMuted ? "muted" : (activeSources.length > 0 ? "speaking" : "listening");
      orb.textContent = isMuted ? "MUTED" : (activeSources.length > 0 ? "SPEAKING" : "LISTENING");
      statusEl.textContent = isMuted ? "Microphone muted" : "Listening...";
    }

    document.addEventListener("keydown", (e) => {
      const key = e.key;

      // SCREEN 1: Setup Key
      if (!apiKey) {
        if (key === "Enter" || key === "Accept") {
          e.preventDefault();
          const val = keyInput.value.trim();
          if (val) {
            apiKey = val;
            localStorage.setItem(STORAGE_KEY, apiKey);
            updateScreen();
          }
        } else if (key === "SoftLeft" || key === "F1") {
          e.preventDefault();
          keyInput.value = "";
        }
        return;
      }

      // SCREEN 2: Live Call
      if (key === "Enter" || key === "Accept") {
        e.preventDefault();
        if (isConnected) stopLiveCall();
        else startLiveCall();
      }
      else if (key === "SoftLeft" || key === "F1") {
        e.preventDefault();
        if (isConnected) toggleMute();
      }
      else if (key === "Escape" || key === "Backspace" || key === "SoftRight" || key === "F2") {
        if (isConnected) {
          e.preventDefault();
          stopLiveCall();
        }
      }
      else if (key === "0" && !isConnected) {
        e.preventDefault();
        localStorage.removeItem(STORAGE_KEY);
        apiKey = "";
        keyInput.value = "";
        updateScreen();
      }
    });

    updateScreen();
  </script>
</body>
</html>
