<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=240, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gemini Live</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #ffffff;
      font-family: sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }
    header {
      width: 100%;
      background: #111827;
      color: #60a5fa;
      font-size: 12px;
      font-weight: bold;
      padding: 5px;
      border-bottom: 1px solid #1f2937;
    }
    #setup-screen, #call-screen {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 8px;
    }
    .hidden { display: none !important; }
    input {
      width: 100%;
      background: #030712;
      color: #ffffff;
      border: 2px solid #3b82f6;
      border-radius: 4px;
      padding: 6px;
      font-size: 13px;
      margin: 8px 0;
      outline: none;
    }
    #orb {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      background: #1e293b;
      border: 4px solid #3b82f6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
      transition: all 0.2s;
    }
    #orb.listening {
      background: #064e3b;
      border-color: #10b981;
      box-shadow: 0 0 16px #10b981;
    }
    #orb.speaking {
      background: #1e3a8a;
      border-color: #60a5fa;
      box-shadow: 0 0 18px #3b82f6;
    }
    #orb.thinking {
      background: #581c87;
      border-color: #a855f7;
      box-shadow: 0 0 16px #a855f7;
    }
    #orb.muted {
      background: #7f1d1d;
      border-color: #ef4444;
    }
    #status {
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.3;
      padding: 0 4px;
      word-break: break-word;
      max-height: 52px;
      overflow: hidden;
    }
    footer {
      width: 100%;
      background: #030712;
      color: #9ca3af;
      font-size: 11px;
      font-weight: bold;
      padding: 5px 8px;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #1f2937;
    }
    .hi { color: #ffffff; }
  </style>
</head>
<body>

  <header>GEMINI LIVE TALK</header>

  <!-- SCREEN 1: ONE-TIME KEY SETUP -->
  <div id="setup-screen">
    <div style="font-size: 12px; color: #cbd5e1;">Enter Gemini API Key:</div>
    <input id="key-input" type="password" placeholder="AIzaSy..." autocomplete="off">
    <div style="font-size: 10px; color: #9ca3af; margin-top: 4px;">
      Tip: Load once with #key=AIza... in URL to auto-save.
    </div>
  </div>

  <!-- SCREEN 2: LIVE VOICE CALL -->
  <div id="call-screen" class="hidden">
    <div id="orb">OFFLINE</div>
    <div id="status">Press OK to call</div>
  </div>

  <!-- HTML5 Audio Element for CloudPhone sound capture (same as YouTube) -->
  <audio id="cloud-player" preload="auto" playsinline style="display:none;"></audio>

  <footer>
    <span id="left-hint">Clear</span>
    <span id="center-hint" class="hi">OK: SAVE</span>
    <span id="right-hint">Exit</span>
  </footer>

  <script>
    const MODEL = "models/gemini-3.8-live";
    const STORAGE_KEY = "hmd_gemini_live_key";

    const setupScreen = document.getElementById("setup-screen");
    const callScreen = document.getElementById("call-screen");
    const keyInput = document.getElementById("key-input");
    const orb = document.getElementById("orb");
    const statusEl = document.getElementById("status");
    const leftHint = document.getElementById("left-hint");
    const centerHint = document.getElementById("center-hint");
    const rightHint = document.getElementById("right-hint");
    const cloudPlayer = document.getElementById("cloud-player");

    // Auto-save key from URL Hash (#key=...) or Query Param (?key=...)
    const hashMatch = window.location.hash.match(/key=([^&]+)/);
    const searchMatch = window.location.search.match(/[?&]key=([^&]+)/);
    const foundKey = (hashMatch && hashMatch[1]) || (searchMatch && searchMatch[1]);
    if (foundKey) {
      localStorage.setItem(STORAGE_KEY, decodeURIComponent(foundKey));
      history.replaceState(null, "", window.location.pathname);
    }

    let apiKey = localStorage.getItem(STORAGE_KEY) || "";
    let ws = null;
    let audioCtx = null;
    let micStream = null;
    let micSourceNode = null;
    let processor = null;
    let isConnected = false;
    let setupDone = false;
    let isMuted = false;

    // Hybrid VAD
    let isSpeaking = false;
    let silenceTimer = null;

    // CloudPhone HTML5 WAV Audio Queue (Guarantees sound on CloudPhone)
    let pcmBuffer = [];
    let pcmBufferByteCount = 0;
    let wavQueue = [];
    let isPlayingWav = false;

    function updateScreen() {
      if (!apiKey) {
        setupScreen.classList.remove("hidden");
        callScreen.classList.add("hidden");
        leftHint.textContent = "Clear";
        centerHint.textContent = "OK: SAVE";
        rightHint.textContent = "Back";
        keyInput.focus();
      } else {
        setupScreen.classList.add("hidden");
        callScreen.classList.remove("hidden");
        leftHint.textContent = isConnected ? "Mute" : "0: Reset";
        centerHint.textContent = isConnected ? "OK: END" : "OK: CALL";
        rightHint.textContent = isConnected ? "End" : "Exit";
      }
    }

    // Helper: Convert PCM Float32 to 16kHz PCM Base64 for input
    function downsampleAndConvert16BitPCM(inputData, inputSampleRate) {
      const targetRate = 16000;
      let samples;
      if (inputSampleRate === targetRate) {
        samples = inputData;
      } else {
        const ratio = inputSampleRate / targetRate;
        const newLength = Math.round(inputData.length / ratio);
        samples = new Float32Array(newLength);
        for (let i = 0; i < newLength; i++) {
          const originIdx = i * ratio;
          const idx = Math.floor(originIdx);
          const frac = originIdx - idx;
          const next = idx + 1 < inputData.length ? inputData[idx + 1] : inputData[idx];
          samples[i] = inputData[idx] + frac * (next - inputData[idx]);
        }
      }

      const buffer = new ArrayBuffer(samples.length * 2);
      const view = new DataView(buffer);
      for (let i = 0; i < samples.length; i++) {
        let s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true);
      }

      let binary = "";
      const bytes = new Uint8Array(buffer);
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    // Turn 24kHz raw PCM bytes into a standard 44-byte WAV Blob
    function pcmToWavBlob(pcmBytes, sampleRate = 24000) {
      const numChannels = 1;
      const bitsPerSample = 16;
      const byteRate = sampleRate * numChannels * (bitsPerSample / 8);
      const blockAlign = numChannels * (bitsPerSample / 8);
      const dataSize = pcmBytes.byteLength;

      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      // "RIFF"
      view.setUint32(0, 0x52494646, false);
      view.setUint32(4, 36 + dataSize, true);
      // "WAVE"
      view.setUint32(8, 0x57415645, false);
      // "fmt "
      view.setUint32(12, 0x666d7420, false);
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM = 1
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitsPerSample, true);
      // "data"
      view.setUint32(36, 0x64617461, false);
      view.setUint32(40, dataSize, true);

      new Uint8Array(buffer, 44).set(pcmBytes);
      return new Blob([buffer], { type: "audio/wav" });
    }

    function enqueueAudioChunk(base64Data) {
      const binary = atob(base64Data);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      pcmBuffer.push(bytes);
      pcmBufferByteCount += bytes.byteLength;

      // Flush every ~0.3s of audio (14,400 bytes at 24kHz 16-bit mono)
      if (pcmBufferByteCount >= 14400) {
        flushPcmBuffer();
      }
    }

    function flushPcmBuffer() {
      if (pcmBufferByteCount === 0) return;

      const combined = new Uint8Array(pcmBufferByteCount);
      let offset = 0;
      for (let i = 0; i < pcmBuffer.length; i++) {
        combined.set(pcmBuffer[i], offset);
        offset += pcmBuffer[i].byteLength;
      }
      pcmBuffer = [];
      pcmBufferByteCount = 0;

      const wavBlob = pcmToWavBlob(combined, 24000);
      const url = URL.createObjectURL(wavBlob);
      wavQueue.push(url);

      if (!isPlayingWav) {
        playNextWav();
      }
    }

    function playNextWav() {
      if (wavQueue.length === 0) {
        isPlayingWav = false;
        if (isConnected) {
          orb.className = isMuted ? "muted" : "listening";
          orb.textContent = isMuted ? "MUTED" : "LISTENING";
        }
        return;
      }

      isPlayingWav = true;
      orb.className = "speaking";
      orb.textContent = "SPEAKING";

      const currentUrl = wavQueue.shift();
      cloudPlayer.src = currentUrl;
      cloudPlayer.play().catch(e => {
        console.error("Play error:", e);
      });

      cloudPlayer.onended = () => {
        URL.revokeObjectURL(currentUrl);
        playNextWav();
      };

      cloudPlayer.onerror = () => {
        URL.revokeObjectURL(currentUrl);
        playNextWav();
      };
    }

    function stopAllAudio() {
      pcmBuffer = [];
      pcmBufferByteCount = 0;
      wavQueue.forEach(u => URL.revokeObjectURL(u));
      wavQueue = [];
      try {
        cloudPlayer.pause();
        cloudPlayer.src = "";
      } catch (_) {}
      isPlayingWav = false;
    }

    async function startLiveCall() {
      const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${apiKey}`;

      try {
        statusEl.textContent = "Opening mic...";
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
        });

        // UNLOCK HTML5 AUDIO ELEMENT IN THIS USER GESTURE (Crucial for CloudPhone!)
        try {
          cloudPlayer.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==";
          cloudPlayer.play().catch(() => {});
        } catch (_) {}

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") await audioCtx.resume();

        statusEl.textContent = "Connecting to Gemini 3.8...";
        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
          statusEl.textContent = "Handshaking...";
          ws.send(JSON.stringify({
            setup: {
              model: MODEL,
              generationConfig: {
                responseModalities: ["AUDIO"],
                speechConfig: {
                  voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } }
                }
              },
              inputAudioTranscription: {},
              outputAudioTranscription: {},
              systemInstruction: {
                parts: [{ text: "You are talking on a live phone call with a user on a feature phone. Be direct, natural, warm, and keep replies short (1-2 sentences)." }]
              }
            }
          }));

          isConnected = true;
          setupDone = false;
          updateScreen();
          orb.className = "listening";
          orb.textContent = "CONNECTING";

          micSourceNode = audioCtx.createMediaStreamSource(micStream);
          processor = audioCtx.createScriptProcessor(4096, 1, 1);

          processor.onaudioprocess = (e) => {
            if (!isConnected || !setupDone || isMuted || ws.readyState !== WebSocket.OPEN) return;
            const inputData = e.inputBuffer.getChannelData(0);

            // Speech & Silence Detection
            let sum = 0;
            for (let i = 0; i < inputData.length; i += 4) {
              sum += inputData[i] * inputData[i];
            }
            const rms = Math.sqrt(sum / (inputData.length / 4));

            if (rms > 0.025) {
              isSpeaking = true;
              if (silenceTimer) {
                clearTimeout(silenceTimer);
                silenceTimer = null;
              }
              if (!isPlayingWav) {
                statusEl.textContent = "Hearing you...";
              }
            } else if (isSpeaking) {
              if (!silenceTimer) {
                silenceTimer = setTimeout(() => {
                  if (ws && ws.readyState === WebSocket.OPEN && !isPlayingWav) {
                    orb.className = "thinking";
                    orb.textContent = "THINKING";
                    statusEl.textContent = "Thinking...";
                    ws.send(JSON.stringify({
                      realtimeInput: { audioStreamEnd: true }
                    }));
                  }
                  isSpeaking = false;
                  silenceTimer = null;
                }, 750);
              }
            }

            const base64Pcm = downsampleAndConvert16BitPCM(inputData, audioCtx.sampleRate);

            ws.send(JSON.stringify({
              realtimeInput: {
                audio: { data: base64Pcm, mimeType: "audio/pcm;rate=16000" },
                mediaChunks: [{ data: base64Pcm, mimeType: "audio/pcm;rate=16000" }]
              }
            }));
          };

          micSourceNode.connect(processor);
          processor.connect(audioCtx.destination);
        };

        ws.onmessage = async (event) => {
          let text;
          if (event.data instanceof Blob) {
            text = await event.data.text();
          } else if (event.data instanceof ArrayBuffer) {
            text = new TextDecoder().decode(event.data);
          } else {
            text = event.data;
          }

          const msg = JSON.parse(text);

          if (msg.error) {
            statusEl.textContent = "Error: " + (msg.error.message || JSON.stringify(msg.error));
            console.error("Gemini Error:", msg.error);
            return;
          }

          if (msg.setupComplete) {
            setupDone = true;
            statusEl.textContent = "Live! Speak now.";
            orb.className = "listening";
            orb.textContent = "LISTENING";
            return;
          }

          if (msg.serverContent?.interrupted) {
            stopAllAudio();
            if (isConnected) {
              orb.className = isMuted ? "muted" : "listening";
              orb.textContent = isMuted ? "MUTED" : "LISTENING";
              statusEl.textContent = "Interrupted. Listening...";
            }
          }

          // User transcript
          if (msg.serverContent?.inputTranscription?.text) {
            statusEl.textContent = "You: " + msg.serverContent.inputTranscription.text;
          }

          // AI transcript
          if (msg.serverContent?.outputTranscription?.text) {
            statusEl.textContent = "AI: " + msg.serverContent.outputTranscription.text;
          }

          // Audio parts from model -> sent to HTML5 WAV Player
          const parts = msg.serverContent?.modelTurn?.parts;
          if (parts) {
            for (const part of parts) {
              if (part.text && !msg.serverContent?.outputTranscription) {
                statusEl.textContent = "AI: " + part.text;
              }
              if (part.inlineData && part.inlineData.data) {
                enqueueAudioChunk(part.inlineData.data);
              }
            }
          }

          if (msg.serverContent?.turnComplete) {
            flushPcmBuffer();
          }
        };

        ws.onerror = (e) => {
          statusEl.textContent = "Socket error. Check key/net.";
          console.error("WS error:", e);
          stopLiveCall();
        };

        ws.onclose = (e) => {
          console.log("WS closed:", e.code, e.reason);
          if (e.code !== 1000) {
            statusEl.textContent = `Ended: code ${e.code} ${e.reason || ''}`;
          }
          stopLiveCall();
        };

      } catch (err) {
        statusEl.textContent = "Audio error: " + err.message;
        console.error(err);
        stopLiveCall();
      }
    }

    function stopLiveCall() {
      isConnected = false;
      setupDone = false;
      isMuted = false;
      isSpeaking = false;
      if (silenceTimer) { clearTimeout(silenceTimer); silenceTimer = null; }
      stopAllAudio();
      if (processor) { processor.disconnect(); processor = null; }
      if (micSourceNode) { micSourceNode.disconnect(); micSourceNode = null; }
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      if (ws) { ws.close(); ws = null; }
      if (audioCtx) { audioCtx.close(); audioCtx = null; }
      orb.className = "";
      orb.textContent = "OFFLINE";
      if (!statusEl.textContent.startsWith("Ended") && !statusEl.textContent.startsWith("Error")) {
        statusEl.textContent = "Call ended. Press OK to call.";
      }
      updateScreen();
    }

    function toggleMute() {
      if (!isConnected) return;
      isMuted = !isMuted;
      orb.className = isMuted ? "muted" : (isPlayingWav ? "speaking" : "listening");
      orb.textContent = isMuted ? "MUTED" : (isPlayingWav ? "SPEAKING" : "LISTENING");
      statusEl.textContent = isMuted ? "Microphone muted" : "Listening...";
    }

    document.addEventListener("keydown", (e) => {
      const key = e.key;

      // SCREEN 1: Setup Key
      if (!apiKey) {
        if (key === "Enter" || key === "Accept") {
          e.preventDefault();
          const val = keyInput.value.trim();
          if (val) {
            apiKey = val;
            localStorage.setItem(STORAGE_KEY, apiKey);
            updateScreen();
          }
        } else if (key === "SoftLeft" || key === "F1") {
          e.preventDefault();
          keyInput.value = "";
        }
        return;
      }

      // SCREEN 2: Live Call
      if (key === "Enter" || key === "Accept") {
        e.preventDefault();
        if (isConnected) stopLiveCall();
        else startLiveCall();
      }
      else if (key === "SoftLeft" || key === "F1") {
        e.preventDefault();
        if (isConnected) toggleMute();
      }
      else if (key === "Escape" || key === "Backspace" || key === "SoftRight" || key === "F2") {
        if (isConnected) {
          e.preventDefault();
          stopLiveCall();
        }
      }
      else if (key === "0" && !isConnected) {
        e.preventDefault();
        localStorage.removeItem(STORAGE_KEY);
        apiKey = "";
        keyInput.value = "";
        updateScreen();
      }
    });

    updateScreen();
  </script>
</body>
</html>
