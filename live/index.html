<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=240, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gemini Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #ffffff;
      font-family: sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      font-size: 13px;
    }
    header {
      width: 100%;
      background: #111827;
      color: #60a5fa;
      font-size: 12px;
      font-weight: bold;
      padding: 6px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
      flex-shrink: 0;
    }
    header .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
      margin-right: 4px;
    }
    #setup-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px;
      text-align: center;
    }
    #chat-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: calc(100vh - 54px);
    }
    .hidden { display: none !important; }
    input[type="password"], input[type="text"] {
      background: #030712;
      color: #ffffff;
      border: 1px solid #3b82f6;
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 13px;
      outline: none;
    }
    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scroll-behavior: smooth;
    }
    .msg {
      padding: 6px 8px;
      border-radius: 8px;
      max-width: 90%;
      line-height: 1.35;
      font-size: 12px;
      word-break: break-word;
    }
    .msg.user {
      background: #2563eb;
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .msg.gemini {
      background: #1e293b;
      color: #e2e8f0;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
      border: 1px solid #334155;
    }
    .msg.voice-tag {
      font-size: 10px;
      color: #93c5fd;
      margin-bottom: 2px;
      display: block;
    }
    #status-banner {
      font-size: 11px;
      color: #93c5fd;
      background: #0f172a;
      padding: 3px 6px;
      text-align: center;
      border-top: 1px solid #1e293b;
      display: none;
      flex-shrink: 0;
    }
    #status-banner.recording {
      display: block;
      background: #7f1d1d;
      color: #fecaca;
      font-weight: bold;
      animation: pulse 1s infinite alternate;
    }
    #status-banner.thinking {
      display: block;
      background: #3b0764;
      color: #e9d5ff;
    }
    @keyframes pulse {
      from { opacity: 0.8; }
      to { opacity: 1; }
    }
    #input-bar {
      display: flex;
      padding: 4px;
      background: #0f172a;
      border-top: 1px solid #1f2937;
      gap: 4px;
      flex-shrink: 0;
    }
    #prompt-input {
      flex: 1;
      height: 28px;
    }
    #send-btn, #voice-btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      padding: 0 8px;
      font-size: 11px;
      font-weight: bold;
      height: 28px;
      cursor: pointer;
    }
    #voice-btn {
      background: #059669;
    }
    #voice-btn.recording {
      background: #dc2626;
      animation: pulse 0.8s infinite alternate;
    }
    footer {
      width: 100%;
      background: #030712;
      color: #9ca3af;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 6px;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #1f2937;
      flex-shrink: 0;
    }
    .hi { color: #ffffff; }
  </style>
</head>
<body>

  <header>
    <div><span class="status-dot"></span>GEMINI AI</div>
    <div style="font-size: 10px; color: #94a3b8;" id="model-tag">Flash 2.5</div>
  </header>

  <!-- SCREEN 1: ONE-TIME KEY SETUP -->
  <div id="setup-screen">
    <div style="font-size: 13px; color: #cbd5e1; margin-bottom: 8px;">Enter Gemini API Key:</div>
    <input id="key-input" type="password" placeholder="AIzaSy..." autocomplete="off" style="width: 100%;">
    <div style="font-size: 10px; color: #9ca3af; margin-top: 8px;">
      Tip: Load URL with #key=AIza... to save automatically.
    </div>
  </div>

  <!-- SCREEN 2: FEATURE-PHONE CHAT -->
  <div id="chat-screen" class="hidden">
    <div id="chat-messages">
      <div class="msg gemini">Hello! Ask me anything, or press <b>*</b> / <b>Mic</b> to voice type.</div>
    </div>
    
    <div id="status-banner"></div>

    <div id="input-bar">
      <button id="voice-btn" title="Voice Typing (*)">🎙️</button>
      <input id="prompt-input" type="text" placeholder="Type or speak..." autocomplete="off">
      <button id="send-btn">OK</button>
    </div>
  </div>

  <footer>
    <span id="left-hint">Voice (*)</span>
    <span id="center-hint" class="hi">Send (OK)</span>
    <span id="right-hint">New (#)</span>
  </footer>

  <script>
    // Fast, lightweight, highly reliable REST endpoint
    const MODEL = "gemini-2.5-flash";
    const STORAGE_KEY = "hmd_gemini_live_key";

    const setupScreen = document.getElementById("setup-screen");
    const chatScreen = document.getElementById("chat-screen");
    const keyInput = document.getElementById("key-input");
    const chatMessages = document.getElementById("chat-messages");
    const promptInput = document.getElementById("prompt-input");
    const sendBtn = document.getElementById("send-btn");
    const voiceBtn = document.getElementById("voice-btn");
    const statusBanner = document.getElementById("status-banner");
    const leftHint = document.getElementById("left-hint");
    const centerHint = document.getElementById("center-hint");
    const rightHint = document.getElementById("right-hint");

    // Auto-save key from URL Hash (#key=...) or Query Param (?key=...)
    const hashMatch = window.location.hash.match(/key=([^&]+)/);
    const searchMatch = window.location.search.match(/[?&]key=([^&]+)/);
    const foundKey = (hashMatch && hashMatch[1]) || (searchMatch && searchMatch[1]);
    if (foundKey) {
      localStorage.setItem(STORAGE_KEY, decodeURIComponent(foundKey));
      history.replaceState(null, "", window.location.pathname);
    }

    let apiKey = localStorage.getItem(STORAGE_KEY) || "";
    let conversationHistory = [];
    let isProcessing = false;

    // Voice typing recording state
    let isRecordingVoice = false;
    let micStream = null;
    let audioCtx = null;
    let processor = null;
    let recordedPcmChunks = [];
    let recordedPcmLength = 0;
    let recordingTimeout = null;

    function updateScreen() {
      if (!apiKey) {
        setupScreen.classList.remove("hidden");
        chatScreen.classList.add("hidden");
        leftHint.textContent = "Clear";
        centerHint.textContent = "OK: SAVE";
        rightHint.textContent = "";
        keyInput.focus();
      } else {
        setupScreen.classList.add("hidden");
        chatScreen.classList.remove("hidden");
        leftHint.textContent = isRecordingVoice ? "Cancel" : "Voice (*)";
        centerHint.textContent = isRecordingVoice ? "Done (OK)" : "Send (OK)";
        rightHint.textContent = "New (#)";
        promptInput.focus();
      }
    }

    function appendMessage(role, text, isVoice = false) {
      const msgEl = document.createElement("div");
      msgEl.className = "msg " + role;
      if (isVoice && role === "user") {
        const tag = document.createElement("span");
        tag.className = "voice-tag";
        tag.textContent = "🎙️ Spoken prompt:";
        msgEl.appendChild(tag);
      }
      const textNode = document.createElement("span");
      textNode.textContent = text;
      msgEl.appendChild(textNode);
      chatMessages.appendChild(msgEl);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // High performance linear downsampling Float32 -> 16kHz PCM
    function downsampleFloat32(source, fromRate, toRate) {
      if (fromRate === toRate) return source;
      const ratio = fromRate / toRate;
      const newLen = Math.round(source.length / ratio);
      const target = new Float32Array(newLen);
      for (let i = 0; i < newLen; i++) {
        const originIdx = i * ratio;
        const idx = Math.floor(originIdx);
        const frac = originIdx - idx;
        const next = idx + 1 < source.length ? source[idx + 1] : source[idx];
        target[i] = source[idx] + frac * (next - source[idx]);
      }
      return target;
    }

    // Convert recorded PCM to standard WAV Base64
    function pcmToWavBase64(pcmBytes, sampleRate = 16000) {
      const numChannels = 1;
      const bitsPerSample = 16;
      const byteRate = sampleRate * numChannels * (bitsPerSample / 8);
      const blockAlign = numChannels * (bitsPerSample / 8);
      const dataSize = pcmBytes.byteLength;

      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      view.setUint32(0, 0x52494646, false); // "RIFF"
      view.setUint32(4, 36 + dataSize, true);
      view.setUint32(8, 0x57415645, false); // "WAVE"
      view.setUint32(12, 0x666d7420, false); // "fmt "
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM = 1
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, byteRate, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitsPerSample, true);
      view.setUint32(36, 0x64617461, false); // "data"
      view.setUint32(40, dataSize, true);

      new Uint8Array(buffer, 44).set(pcmBytes);

      let binary = "";
      const bytes = new Uint8Array(buffer);
      const chunkSize = 0x8000;
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    // Call Gemini 2.5 Flash over plain HTTPS REST (Ultra-reliable on CloudPhone)
    async function sendPromptToGemini(contentsPayload, displayUserText = null, isVoice = false) {
      if (isProcessing) return;
      isProcessing = true;

      if (displayUserText) {
        appendMessage("user", displayUserText, isVoice);
      }

      statusBanner.className = "thinking";
      statusBanner.textContent = "Gemini is thinking...";

      const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${apiKey}`;

      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: contentsPayload,
            systemInstruction: {
              parts: [{
                text: "You are a concise, smart AI assistant for a user on a compact 240x320 feature phone keypad. Answer clearly, accurately, and keep answers concise and easy to read without unnecessary fluff."
              }]
            }
          })
        });

        const data = await res.json();

        if (data.error) {
          appendMessage("gemini", "Error: " + (data.error.message || "Failed to get reply."));
        } else {
          const replyText = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (replyText) {
            appendMessage("gemini", replyText);
            // Save to history for multi-turn conversation
            conversationHistory.push({
              role: "model",
              parts: [{ text: replyText }]
            });
          } else {
            appendMessage("gemini", "No response received.");
          }
        }
      } catch (err) {
        appendMessage("gemini", "Connection error: " + err.message);
      } finally {
        isProcessing = false;
        statusBanner.className = "";
        statusBanner.textContent = "";
        promptInput.focus();
      }
    }

    function handleSendText() {
      const text = promptInput.value.trim();
      if (!text || isProcessing) return;
      promptInput.value = "";

      // Add to conversation
      conversationHistory.push({
        role: "user",
        parts: [{ text: text }]
      });

      sendPromptToGemini([...conversationHistory], text, false);
    }

    // VOICE TYPING: Record speech and let Gemini transcribe & answer directly!
    async function startVoiceRecording() {
      if (isRecordingVoice || isProcessing) return;

      try {
        statusBanner.className = "recording";
        statusBanner.textContent = "🎙️ Listening... Speak now!";
        voiceBtn.classList.add("recording");
        isRecordingVoice = true;
        updateScreen();

        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true }
        });

        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") await audioCtx.resume();

        recordedPcmChunks = [];
        recordedPcmLength = 0;

        const micSource = audioCtx.createMediaStreamSource(micStream);
        processor = audioCtx.createScriptProcessor(4096, 1, 1);

        processor.onaudioprocess = (e) => {
          if (!isRecordingVoice) return;
          const inputData = e.inputBuffer.getChannelData(0);
          const downsampled = downsampleFloat32(inputData, audioCtx.sampleRate, 16000);

          // Convert Float32 to Int16 PCM
          const int16 = new Int16Array(downsampled.length);
          for (let i = 0; i < downsampled.length; i++) {
            const s = Math.max(-1, Math.min(1, downsampled[i]));
            int16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
          }

          const byteChunk = new Uint8Array(int16.buffer);
          recordedPcmChunks.push(byteChunk);
          recordedPcmLength += byteChunk.byteLength;
        };

        micSource.connect(processor);
        processor.connect(audioCtx.destination);

        // Auto stop after 7 seconds max to keep response fast
        recordingTimeout = setTimeout(() => {
          if (isRecordingVoice) stopVoiceRecordingAndSend();
        }, 7000);

      } catch (err) {
        statusBanner.className = "";
        statusBanner.textContent = "";
        voiceBtn.classList.remove("recording");
        isRecordingVoice = false;
        appendMessage("gemini", "Mic error: " + err.message);
        updateScreen();
      }
    }

    function stopVoiceRecordingAndSend() {
      if (!isRecordingVoice) return;
      isRecordingVoice = false;
      if (recordingTimeout) { clearTimeout(recordingTimeout); recordingTimeout = null; }

      voiceBtn.classList.remove("recording");
      statusBanner.className = "thinking";
      statusBanner.textContent = "Processing speech...";

      // Clean up audio graph
      if (processor) { processor.disconnect(); processor = null; }
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      if (audioCtx) { audioCtx.close(); audioCtx = null; }

      updateScreen();

      if (recordedPcmLength < 3200) {
        // Less than 0.1s of audio recorded
        statusBanner.className = "";
        statusBanner.textContent = "";
        appendMessage("gemini", "Recording was too short. Speak after clicking Voice.");
        return;
      }

      // Merge recorded PCM chunks
      const combined = new Uint8Array(recordedPcmLength);
      let offset = 0;
      for (let i = 0; i < recordedPcmChunks.length; i++) {
        combined.set(recordedPcmChunks[i], offset);
        offset += recordedPcmChunks[i].byteLength;
      }
      recordedPcmChunks = [];
      recordedPcmLength = 0;

      const wavBase64 = pcmToWavBase64(combined, 16000);

      // Send spoken audio directly to Gemini 2.5 Flash
      const voiceTurn = {
        role: "user",
        parts: [
          {
            inlineData: {
              mimeType: "audio/wav",
              data: wavBase64
            }
          },
          {
            text: "Please transcribe the speech in this audio and answer it. Format as: '[Your Question]\\n\\n[Answer]'"
          }
        ]
      };

      conversationHistory.push(voiceTurn);
      sendPromptToGemini([...conversationHistory], "🎙️ Voice message sent...", true);
    }

    function cancelVoiceRecording() {
      if (!isRecordingVoice) return;
      isRecordingVoice = false;
      if (recordingTimeout) { clearTimeout(recordingTimeout); recordingTimeout = null; }
      voiceBtn.classList.remove("recording");
      statusBanner.className = "";
      statusBanner.textContent = "";
      if (processor) { processor.disconnect(); processor = null; }
      if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
      if (audioCtx) { audioCtx.close(); audioCtx = null; }
      recordedPcmChunks = [];
      recordedPcmLength = 0;
      updateScreen();
    }

    function clearChat() {
      conversationHistory = [];
      chatMessages.innerHTML = "";
      appendMessage("gemini", "Chat cleared. Ready for your next question!");
      promptInput.value = "";
      promptInput.focus();
    }

    // Button Click Listeners
    sendBtn.addEventListener("click", () => {
      if (isRecordingVoice) stopVoiceRecordingAndSend();
      else handleSendText();
    });

    voiceBtn.addEventListener("click", () => {
      if (isRecordingVoice) stopVoiceRecordingAndSend();
      else startVoiceRecording();
    });

    // Feature-Phone Keypad Navigation
    document.addEventListener("keydown", (e) => {
      const key = e.key;

      // SCREEN 1: Setup Key
      if (!apiKey) {
        if (key === "Enter" || key === "Accept") {
          e.preventDefault();
          const val = keyInput.value.trim();
          if (val) {
            apiKey = val;
            localStorage.setItem(STORAGE_KEY, apiKey);
            updateScreen();
          }
        } else if (key === "SoftLeft" || key === "F1") {
          e.preventDefault();
          keyInput.value = "";
        }
        return;
      }

      // SCREEN 2: Chat screen controls
      // Center Key (Enter / OK): Send message or Finish voice recording
      if (key === "Enter" || key === "Accept") {
        e.preventDefault();
        if (isRecordingVoice) {
          stopVoiceRecordingAndSend();
        } else {
          handleSendText();
        }
      }
      // Star Key (*) or Left Soft Key: Toggle Voice Typing
      else if (key === "*" || key === "SoftLeft" || key === "F1") {
        e.preventDefault();
        if (isRecordingVoice) {
          cancelVoiceRecording();
        } else {
          startVoiceRecording();
        }
      }
      // Hash Key (#) or Right Soft Key (when input empty): New Chat
      else if (key === "#" || ((key === "Escape" || key === "SoftRight" || key === "F2") && !promptInput.value)) {
        e.preventDefault();
        if (isRecordingVoice) {
          cancelVoiceRecording();
        } else {
          clearChat();
        }
      }
      // Scroll Up (Up Arrow)
      else if (key === "ArrowUp") {
        chatMessages.scrollTop -= 60;
      }
      // Scroll Down (Down Arrow)
      else if (key === "ArrowDown") {
        chatMessages.scrollTop += 60;
      }
      // Keypad '0' (when prompt input is completely empty): Reset API Key
      else if (key === "0" && !promptInput.value && !isRecordingVoice && document.activeElement !== promptInput) {
        e.preventDefault();
        localStorage.removeItem(STORAGE_KEY);
        apiKey = "";
        keyInput.value = "";
        updateScreen();
      }
    });

    updateScreen();
  </script>
</body>
</html>
