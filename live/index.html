<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gemini Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090d16;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      width: 100vw;
      max-width: 240px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      font-size: 12px;
    }

    header {
      width: 100%;
      background: #111827;
      color: #60a5fa;
      font-size: 11px;
      font-weight: bold;
      padding: 5px 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
      flex-shrink: 0;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 3px;
    }
    .badge-ok { background: #064e3b; color: #6ee7b7; }
    .badge-err { background: #7f1d1d; color: #fca5a5; }

    #setup-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px 8px;
      text-align: center;
      gap: 8px;
    }

    #chat-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: calc(100vh - 48px);
    }

    .hidden { display: none !important; }

    input[type="text"], input[type="password"] {
      background: #030712;
      color: #ffffff;
      border: 1px solid #3b82f6;
      border-radius: 4px;
      padding: 6px 6px;
      font-size: 12px;
      outline: none;
      width: 100%;
    }
    input:focus, button:focus {
      outline: 2px solid #38bdf8 !important;
      border-color: #60a5fa !important;
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      scroll-behavior: smooth;
    }

    .msg {
      padding: 5px 7px;
      border-radius: 6px;
      max-width: 92%;
      line-height: 1.3;
      font-size: 12px;
      word-break: break-word;
    }

    .msg.user {
      background: #2563eb;
      color: #ffffff;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .msg.gemini {
      background: #1e293b;
      color: #f1f5f9;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
      border: 1px solid #334155;
    }

    .msg.error {
      background: #450a0a;
      color: #fca5a5;
      border: 1px solid #991b1b;
      align-self: center;
      font-size: 11px;
    }

    .voice-tag {
      font-size: 10px;
      color: #93c5fd;
      display: block;
      margin-bottom: 2px;
    }

    #status-banner {
      font-size: 10px;
      padding: 4px 6px;
      text-align: center;
      display: none;
      flex-shrink: 0;
    }
    #status-banner.recording {
      display: block;
      background: #7f1d1d;
      color: #fecaca;
      font-weight: bold;
    }
    #status-banner.thinking {
      display: block;
      background: #3b0764;
      color: #e9d5ff;
    }

    #chat-form {
      display: flex;
      padding: 3px 4px;
      background: #0f172a;
      border-top: 1px solid #1f2937;
      gap: 3px;
      flex-shrink: 0;
      align-items: center;
    }

    #prompt-input {
      flex: 1;
      height: 28px;
    }

    .btn {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      padding: 0 8px;
      font-size: 11px;
      font-weight: bold;
      height: 28px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .btn:active { background: #1d4ed8; }

    #voice-btn {
      background: #059669;
      padding: 0 6px;
    }
    #voice-btn.recording {
      background: #dc2626;
    }

    footer {
      width: 100%;
      background: #030712;
      color: #9ca3af;
      font-size: 10px;
      font-weight: bold;
      padding: 3px 4px;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #1f2937;
      flex-shrink: 0;
    }
    .hint-col { text-align: center; flex: 1; }
    .hint-left { text-align: left; }
    .hint-right { text-align: right; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header>
    <div><b>GEMINI AI</b> <span id="model-tag" style="font-size: 9px; color: #94a3b8;">[3.5-Lite]</span></div>
    <div id="key-badge" class="status-badge badge-err">No Key</div>
  </header>

  <!-- Setup Screen: Shown only if API Key is missing -->
  <div id="setup-screen" class="hidden">
    <div style="font-size: 12px; font-weight: bold; color: #e2e8f0;">Gemini API Key Required</div>
    <form id="setup-form" style="width: 100%; display: flex; flex-direction: column; gap: 6px;">
      <input id="key-input" type="text" placeholder="Paste AIzaSy... here" autocomplete="off">
      <button type="submit" class="btn" style="width: 100%; height: 30px;">SAVE KEY (OK)</button>
    </form>
    <div style="font-size: 10px; color: #94a3b8; line-height: 1.2;">
      Tip: Open URL as:<br>
      <code style="color: #60a5fa; font-size: 9px;">.../live/#key=AIza...</code>
    </div>
  </div>

  <!-- Chat Screen -->
  <div id="chat-screen">
    <div id="chat-messages">
      <div class="msg gemini">
        <b>Connected!</b> Type a message and press <b>Send</b>, or press <b>🎙️</b> (or <b>LSK</b>) to speak.
      </div>
    </div>

    <div id="status-banner"></div>

    <!-- Hidden Native Audio Capture Input (Supported across CloudPhone versions) -->
    <input type="file" id="audio-file-input" accept="audio/*" capture="microphone" class="hidden">

    <!-- Wrapped in a true HTML Form so Enter on keypad natively triggers submit -->
    <form id="chat-form" action="javascript:void(0);">
      <button type="button" id="voice-btn" class="btn" title="Voice Typing (LSK)">🎙️</button>
      <input id="prompt-input" type="text" placeholder="Type prompt..." autocomplete="off">
      <button type="submit" id="send-btn" class="btn">Send</button>
    </form>
  </div>

  <!-- Soft Key & D-Pad Hints (CloudPhone Design Standard) -->
  <footer>
    <div id="left-hint" class="hint-col hint-left">LSK: Voice</div>
    <div id="center-hint" class="hint-col">OK: Send</div>
    <div id="right-hint" class="hint-col hint-right">#: New</div>
  </footer>

  <script>
    // Candidate Models: Try fast modern 3.5-flash-lite first, fallback to 3.6-flash, 2.5-flash, or 1.5-flash
    const CANDIDATE_MODELS = [
      "gemini-3.5-flash-lite",
      "gemini-3.6-flash",
      "gemini-2.5-flash",
      "gemini-1.5-flash"
    ];
    let currentModelIndex = 0;

    const STORAGE_KEY = "hmd_gemini_api_key";
    let apiKey = "";

    // DOM Elements
    const setupScreen = document.getElementById("setup-screen");
    const chatScreen = document.getElementById("chat-screen");
    const setupForm = document.getElementById("setup-form");
    const keyInput = document.getElementById("key-input");
    const keyBadge = document.getElementById("key-badge");
    const modelTag = document.getElementById("model-tag");
    const chatMessages = document.getElementById("chat-messages");
    const chatForm = document.getElementById("chat-form");
    const promptInput = document.getElementById("prompt-input");
    const sendBtn = document.getElementById("send-btn");
    const voiceBtn = document.getElementById("voice-btn");
    const audioFileInput = document.getElementById("audio-file-input");
    const statusBanner = document.getElementById("status-banner");
    const leftHint = document.getElementById("left-hint");
    const centerHint = document.getElementById("center-hint");
    const rightHint = document.getElementById("right-hint");

    // Initialize API Key from URL Hash, Query Param, or LocalStorage
    function initApiKey() {
      const hashMatch = window.location.hash.match(/key=([^&]+)/);
      const searchMatch = window.location.search.match(/[?&]key=([^&]+)/);
      const keyFromUrl = (hashMatch && hashMatch[1]) || (searchMatch && searchMatch[1]);

      if (keyFromUrl) {
        apiKey = decodeURIComponent(keyFromUrl).trim();
        try { localStorage.setItem(STORAGE_KEY, apiKey); } catch (e) {}
      } else {
        try { apiKey = localStorage.getItem(STORAGE_KEY) || ""; } catch (e) { apiKey = ""; }
      }
      renderScreenState();
    }

    function renderScreenState() {
      if (apiKey) {
        keyBadge.className = "status-badge badge-ok";
        keyBadge.textContent = "Key: OK";
        setupScreen.classList.add("hidden");
        chatScreen.classList.remove("hidden");
        leftHint.textContent = isRecordingVoice ? "Cancel" : "LSK: Mic";
        centerHint.textContent = isRecordingVoice ? "OK: Done" : "OK: Send";
        rightHint.textContent = "#: New";
        promptInput.focus();
      } else {
        keyBadge.className = "status-badge badge-err";
        keyBadge.textContent = "No Key";
        chatScreen.classList.add("hidden");
        setupScreen.classList.remove("hidden");
        leftHint.textContent = "";
        centerHint.textContent = "OK: Save";
        rightHint.textContent = "";
        keyInput.focus();
      }
      modelTag.textContent = "[" + CANDIDATE_MODELS[currentModelIndex].replace("gemini-", "") + "]";
    }

    // Save key from form submit
    setupForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const val = keyInput.value.trim();
      if (val) {
        apiKey = val;
        try { localStorage.setItem(STORAGE_KEY, apiKey); } catch (err) {}
        renderScreenState();
      }
    });

    let conversationHistory = [];
    let isProcessing = false;

    function appendMessage(role, text, isVoice = false) {
      const msgEl = document.createElement("div");
      msgEl.className = "msg " + role;
      if (isVoice && role === "user") {
        const tag = document.createElement("span");
        tag.className = "voice-tag";
        tag.textContent = "🎙️ Spoken prompt:";
        msgEl.appendChild(tag);
      }
      const textNode = document.createElement("span");
      textNode.textContent = text;
      msgEl.appendChild(textNode);
      chatMessages.appendChild(msgEl);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return msgEl;
    }

    // Primary send function with automatic model fallback
    async function sendPromptToGemini(contentsPayload, displayUserText = null, isVoice = false) {
      if (!apiKey) {
        appendMessage("error", "No API key found. Enter key on setup screen.");
        renderScreenState();
        return;
      }
      if (isProcessing) return;
      isProcessing = true;

      if (displayUserText) {
        appendMessage("user", displayUserText, isVoice);
      }

      statusBanner.className = "thinking";
      statusBanner.textContent = "Gemini is thinking...";

      let success = false;
      let lastErrorMessage = "";

      for (let i = currentModelIndex; i < CANDIDATE_MODELS.length; i++) {
        const modelName = CANDIDATE_MODELS[i];
        modelTag.textContent = "[" + modelName.replace("gemini-", "") + "]";
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;

        try {
          const res = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: contentsPayload,
              systemInstruction: {
                parts: [{
                  text: "You are a concise, smart AI assistant for a user on a compact 240x320 feature phone. Keep answers direct, accurate, and easy to read."
                }]
              }
            })
          });

          const data = await res.json();

          if (res.ok && data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
            const reply = data.candidates[0].content.parts[0].text;
            appendMessage("gemini", reply);
            conversationHistory.push({
              role: "model",
              parts: [{ text: reply }]
            });
            currentModelIndex = i;
            success = true;
            break;
          } else if (data.error) {
            lastErrorMessage = data.error.message || `Error ${res.status}`;
            if (data.error.code === 404 || lastErrorMessage.toLowerCase().includes("not found")) {
              continue;
            } else {
              appendMessage("error", `API Error: ${lastErrorMessage}`);
              success = true;
              break;
            }
          } else {
            lastErrorMessage = `HTTP ${res.status} empty response`;
          }
        } catch (fetchErr) {
          lastErrorMessage = "Network error: " + fetchErr.message;
          break;
        }
      }

      if (!success) {
        appendMessage("error", "Failed: " + lastErrorMessage);
      }

      isProcessing = false;
      statusBanner.className = "";
      statusBanner.textContent = "";
      promptInput.focus();
    }

    // Form submit handler
    chatForm.addEventListener("submit", (e) => {
      e.preventDefault();
      handleSendText();
    });

    function handleSendText() {
      const text = promptInput.value.trim();
      if (!text || isProcessing) return;
      promptInput.value = "";

      conversationHistory.push({
        role: "user",
        parts: [{ text: text }]
      });

      sendPromptToGemini([...conversationHistory], text, false);
    }

    function clearChat() {
      conversationHistory = [];
      chatMessages.innerHTML = `
        <div class="msg gemini">
          <b>New chat started.</b> Type a message or press <b>🎙️</b> to voice type.
        </div>
      `;
      promptInput.value = "";
      promptInput.focus();
    }

    // Helper: Convert Blob or File to Base64
    function readBlobAsBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const result = reader.result;
          const commaIdx = result.indexOf(",");
          resolve({
            mimeType: blob.type || "audio/webm",
            data: commaIdx !== -1 ? result.substring(commaIdx + 1) : result
          });
        };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    // VOICE TYPING ENGINE (Chromium MediaRecorder + Native Sound Recorder Fallback)
    let isRecordingVoice = false;
    let micStream = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let recordTimer = null;
    let recordSeconds = 0;

    async function startVoiceRecording() {
      if (isRecordingVoice || isProcessing) return;

      // Check if getUserMedia is supported
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined") {
        console.log("Live stream not supported, opening native recorder...");
        audioFileInput.click();
        return;
      }

      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });

        let mimeType = "audio/webm";
        if (MediaRecorder.isTypeSupported("audio/webm;codecs=opus")) {
          mimeType = "audio/webm;codecs=opus";
        } else if (MediaRecorder.isTypeSupported("audio/webm")) {
          mimeType = "audio/webm";
        } else if (MediaRecorder.isTypeSupported("audio/mp4")) {
          mimeType = "audio/mp4";
        } else if (MediaRecorder.isTypeSupported("audio/ogg")) {
          mimeType = "audio/ogg";
        }

        mediaRecorder = new MediaRecorder(micStream, { mimeType });
        audioChunks = [];

        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) {
            audioChunks.push(e.data);
          }
        };

        mediaRecorder.onstop = async () => {
          clearInterval(recordTimer);
          voiceBtn.classList.remove("recording");
          statusBanner.className = "";
          statusBanner.textContent = "";

          // Stop mic tracks
          if (micStream) {
            micStream.getTracks().forEach(t => t.stop());
            micStream = null;
          }

          if (audioChunks.length === 0) {
            appendMessage("error", "No audio captured from mic. Opening Phone Voice Recorder...");
            audioFileInput.click();
            return;
          }

          const combinedBlob = new Blob(audioChunks, { type: mimeType });
          audioChunks = [];

          if (combinedBlob.size < 100) {
            appendMessage("error", "Recording too short. Opening Phone Voice Recorder...");
            audioFileInput.click();
            return;
          }

          statusBanner.className = "thinking";
          statusBanner.textContent = "Transcribing speech...";

          try {
            const audioData = await readBlobAsBase64(combinedBlob);
            const cleanMime = audioData.mimeType.split(";")[0] || "audio/webm";

            const voicePayload = [
              ...conversationHistory,
              {
                role: "user",
                parts: [
                  {
                    inlineData: {
                      mimeType: cleanMime,
                      data: audioData.data
                    }
                  },
                  {
                    text: "First transcribe my spoken words accurately as 'You said: [transcription]', then directly provide your answer. Keep your response concise."
                  }
                ]
              }
            ];

            sendPromptToGemini(voicePayload, "🎙️ [Voice prompt sent]", true);
          } catch (err) {
            appendMessage("error", "Voice processing error: " + err.message);
          }
        };

        mediaRecorder.start(200); // Collect slice every 200ms
        isRecordingVoice = true;
        recordSeconds = 0;
        voiceBtn.classList.add("recording");
        statusBanner.className = "recording";
        statusBanner.textContent = "🎙️ Listening (0s)... OK to send";
        renderScreenState();

        recordTimer = setInterval(() => {
          recordSeconds++;
          statusBanner.textContent = `🎙️ Listening (${recordSeconds}s)... OK to send`;
          if (recordSeconds >= 12) {
            stopVoiceRecordingAndSend();
          }
        }, 1000);

      } catch (err) {
        cancelVoiceRecording();
        console.warn("getUserMedia failed, using native file picker:", err);
        appendMessage("error", "Live mic blocked: " + err.message + ". Opening Phone Recorder...");
        audioFileInput.click();
      }
    }

    function cancelVoiceRecording() {
      if (recordTimer) clearInterval(recordTimer);
      isRecordingVoice = false;
      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        try { mediaRecorder.stop(); } catch (e) {}
      }
      if (micStream) {
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
      }
      mediaRecorder = null;
      audioChunks = [];
      voiceBtn.classList.remove("recording");
      statusBanner.className = "";
      statusBanner.textContent = "";
      renderScreenState();
    }

    function stopVoiceRecordingAndSend() {
      if (!isRecordingVoice) return;
      isRecordingVoice = false;
      renderScreenState();

      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        mediaRecorder.stop();
      }
    }

    // Native Audio File/Recorder Handler (100% reliable fallback on CloudPhone)
    audioFileInput.addEventListener("change", async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      statusBanner.className = "thinking";
      statusBanner.textContent = "Uploading audio...";

      try {
        const audioData = await readBlobAsBase64(file);
        let cleanMime = audioData.mimeType.split(";")[0] || "audio/wav";
        if (cleanMime.startsWith("video/")) {
          cleanMime = cleanMime.replace("video/", "audio/");
        }

        const voicePayload = [
          ...conversationHistory,
          {
            role: "user",
            parts: [
              {
                inlineData: {
                  mimeType: cleanMime,
                  data: audioData.data
                }
              },
              {
                text: "First transcribe my spoken words accurately as 'You said: [transcription]', then directly provide your answer. Keep your response concise."
              }
            ]
          }
        ];

        sendPromptToGemini(voicePayload, "🎙️ [Recorded audio sent]", true);
      } catch (err) {
        appendMessage("error", "Failed to read audio: " + err.message);
        statusBanner.className = "";
        statusBanner.textContent = "";
      } finally {
        audioFileInput.value = "";
      }
    });

    voiceBtn.addEventListener("click", () => {
      if (isRecordingVoice) stopVoiceRecordingAndSend();
      else startVoiceRecording();
    });

    // CloudPhone Keypad Navigation Handling (Matching developer.cloudfone.com)
    document.addEventListener("keydown", (e) => {
      const key = e.key;
      const keyCode = e.keyCode;

      // In CloudPhone: Left Soft Key (LSK) triggers 'Escape' (keyCode 27)
      if (key === "Escape" || keyCode === 27 || key === "SoftLeft" || key === "F1") {
        e.preventDefault();
        if (isRecordingVoice) {
          cancelVoiceRecording();
        } else if (apiKey) {
          startVoiceRecording();
        }
        return;
      }

      // Center Key (Enter / OK) when recording finishes voice
      if ((key === "Enter" || keyCode === 13 || key === "Accept") && isRecordingVoice) {
        e.preventDefault();
        stopVoiceRecordingAndSend();
        return;
      }

      // Hash key (#): New Chat
      if (key === "#" && !promptInput.value && !isRecordingVoice) {
        e.preventDefault();
        clearChat();
        return;
      }

      // Star key (*): Toggle Voice Typing
      if (key === "*" && !promptInput.value) {
        e.preventDefault();
        if (isRecordingVoice) stopVoiceRecordingAndSend();
        else startVoiceRecording();
        return;
      }

      // '0' key when input is not focused: Reset stored key
      if (key === "0" && document.activeElement !== promptInput && document.activeElement !== keyInput) {
        e.preventDefault();
        try { localStorage.removeItem(STORAGE_KEY); } catch (err) {}
        apiKey = "";
        initApiKey();
        return;
      }

      // D-Pad ArrowUp / ArrowDown scrolling when chat messages need reading
      if (key === "ArrowUp" && document.activeElement !== promptInput && document.activeElement !== keyInput) {
        chatMessages.scrollTop -= 50;
      } else if (key === "ArrowDown" && document.activeElement !== promptInput && document.activeElement !== keyInput) {
        chatMessages.scrollTop += 50;
      }
    });

    // Initialize on load
    initApiKey();
  </script>
</body>
</html>
